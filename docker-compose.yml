# zknode-autonomi — portable compose (based on live SCM4 p4p-wiki-merge)
#
# All host paths derive from ${ZK_ROOT}. On the SCM4 the repo lives at
# /home/zero-tech/zknode-autonomi; on a portable USB drive it lives at the
# drive mount (e.g. /mnt/zknode). Set ZK_ROOT explicitly, or leave it unset
# to use the compose file directory (repo-relative).
#
# Host binaries (chatd, zkchat, llm-wiki, ant) and the wiki data set are
# vendored by scripts/portable/usb-prep.sh into ${ZK_ROOT}/bin and
# ${ZK_ROOT}/wikis so no foreign host dependency remains.
networks:
  autonomi:
    driver: bridge
services:
  antd:
    container_name: antd
    entrypoint: ["sh", "-c"]
    image: ${IMAGE_ANTD:-zeros/antd:arm64}
    network_mode: host
    restart: unless-stopped
    environment:
    - HOME=/var/lib/antd
    user: root
    volumes:
    - ${ZK_ANT_SHARE:-${ZK_ROOT}/data/ant-share}:/var/lib/antd/.local/share/ant
    - ${ZK_ANT_NODE:-${ZK_ROOT}/data/ant-node}:/var/lib/ant-node
    - ${ZK_ANTD_NODE1:-${ZK_ROOT}/data/antd-node-1}:/var/lib/antd/node-1
    - ${ZK_ANTD_LOGS:-${ZK_ROOT}/data/antd-logs}:/var/lib/antd/logs
    command:
    - |
      mkdir -p /var/lib/ant-node/chunks /var/lib/antd/logs
      B1=/var/lib/antd/.local/share/ant/bin/ant-node-0.14.4
      if [ ! -x "$$B1" ]; then
        echo "antd: ERROR: node binary not found at $$B1"
        exit 1
      fi
      echo "antd: starting ant-node..."
      $$B1 \
        --rewards-address ${ANT_REWARDS_ADDRESS:-0xf21CEFD6773491323B05162f62bE5106B27893aa} \
        --root-dir /var/lib/antd/node-1 \
        --port ${ANTD_PORT:-12000} \
        --ipv4-only \
        --network-mode ${ANT_NETWORK_MODE:-testnet} \
        --evm-network ${ANT_EVM_NETWORK:-arbitrum-sepolia} \
        --enable-logging \
        --log-level debug \
        --log-dir /var/lib/antd/logs \
        --bootstrap 207.148.94.42:10000 \
        --bootstrap 45.77.50.10:10000 \
        --bootstrap 66.135.23.83:10000 \
        --bootstrap 149.248.9.2:10000 \
        --bootstrap 49.12.119.240:10000 \
        --bootstrap 5.161.25.133:10000 \
        --bootstrap 18.228.202.183:10000 \
        2>&1 &
      P1=$$!
      echo "antd: ant-node started (PID $$P1)"
      echo "antd: entering monitor loop"
      while true; do
        if ! kill -0 $$P1 2>/dev/null; then
          echo "antd: node died, restarting..."
          $$B1 \
            --rewards-address ${ANT_REWARDS_ADDRESS:-0xf21CEFD6773491323B05162f62bE5106B27893aa} \
            --root-dir /var/lib/antd/node-1 \
            --port ${ANTD_PORT:-12000} \
            --ipv4-only \
            --network-mode ${ANT_NETWORK_MODE:-testnet} \
            --evm-network ${ANT_EVM_NETWORK:-arbitrum-sepolia} \
            --enable-logging \
            --log-level debug \
            --log-dir /var/lib/antd/logs \
            --bootstrap 207.148.94.42:10000 \
            --bootstrap 45.77.50.10:10000 \
            --bootstrap 66.135.23.83:10000 \
            --bootstrap 149.248.9.2:10000 \
            --bootstrap 49.12.119.240:10000 \
            --bootstrap 5.161.25.133:10000 \
            --bootstrap 18.228.202.183:10000 \
            2>&1 &
          P1=$$!
          echo "antd: ant-node restarted (PID $$P1)"
        fi
        sleep 30
      done
  mix-1:
    command:
    - /usr/local/bin/server
    - -f
    - /var/lib/katzenpost/mix1/katzenpost.toml
    container_name: mix-1
    depends_on:
    - mix-dirauth-1
    - mix-dirauth-2
    - mix-dirauth-3
    image: ${IMAGE_MIXNET:-zeros/mixnet-node:arm64}
    mem_limit: ${MIXNET_MEM_LIMIT}
    network_mode: host
    restart: unless-stopped
    volumes:
    - ${ZK_ROOT}/config/mixnet:/var/lib/katzenpost
  mix-2:
    command:
    - /usr/local/bin/server
    - -f
    - /var/lib/katzenpost/mix2/katzenpost.toml
    container_name: mix-2
    depends_on:
    - mix-dirauth-1
    - mix-dirauth-2
    - mix-dirauth-3
    image: ${IMAGE_MIXNET:-zeros/mixnet-node:arm64}
    mem_limit: ${MIXNET_MEM_LIMIT}
    network_mode: host
    restart: unless-stopped
    volumes:
    - ${ZK_ROOT}/config/mixnet:/var/lib/katzenpost
  mix-3:
    command:
    - /usr/local/bin/server
    - -f
    - /var/lib/katzenpost/mix3/katzenpost.toml
    container_name: mix-3
    depends_on:
    - mix-dirauth-1
    - mix-dirauth-2
    - mix-dirauth-3
    image: ${IMAGE_MIXNET:-zeros/mixnet-node:arm64}
    mem_limit: ${MIXNET_MEM_LIMIT}
    network_mode: host
    restart: unless-stopped
    volumes:
    - ${ZK_ROOT}/config/mixnet:/var/lib/katzenpost
  mix-client:
    command:
    - kpclientd -c /var/lib/katzenpost/client/client.toml & PID=$!; echo 'Waiting
      for PKI doc...'; for i in $(seq 1 30); do /usr/local/bin/fetch -f /var/lib/katzenpost/client/thinclient.toml
      && break; sleep 2; done; echo 'PKI doc available'; wait $PID
    container_name: mix-client
    depends_on:
    - mix-gateway
    entrypoint:
    - sh
    - -c
    image: ${IMAGE_MIXNET:-zeros/mixnet-node:arm64}
    mem_limit: 128m
    network_mode: host
    restart: unless-stopped
    volumes:
    - ${ZK_ROOT}/config/mixnet:/var/lib/katzenpost
  mix-dirauth-1:
    command:
    - while true; do /usr/local/bin/dirauth -f /var/lib/katzenpost/auth1/authority.toml;
      sleep 2; done
    container_name: mix-dirauth-1
    entrypoint:
    - sh
    - -c
    image: ${IMAGE_MIXNET:-zeros/mixnet-node:arm64}
    mem_limit: ${MIXNET_MEM_LIMIT}
    network_mode: host
    restart: unless-stopped
    volumes:
    - ${ZK_ROOT}/config/mixnet:/var/lib/katzenpost
  mix-dirauth-2:
    command:
    - while true; do /usr/local/bin/dirauth -f /var/lib/katzenpost/auth2/authority.toml;
      sleep 2; done
    container_name: mix-dirauth-2
    entrypoint:
    - sh
    - -c
    image: ${IMAGE_MIXNET:-zeros/mixnet-node:arm64}
    mem_limit: ${MIXNET_MEM_LIMIT}
    network_mode: host
    restart: unless-stopped
    volumes:
    - ${ZK_ROOT}/config/mixnet:/var/lib/katzenpost
  mix-dirauth-3:
    command:
    - while true; do /usr/local/bin/dirauth -f /var/lib/katzenpost/auth3/authority.toml;
      sleep 2; done
    container_name: mix-dirauth-3
    entrypoint:
    - sh
    - -c
    image: ${IMAGE_MIXNET:-zeros/mixnet-node:arm64}
    mem_limit: ${MIXNET_MEM_LIMIT}
    network_mode: host
    restart: unless-stopped
    volumes:
    - ${ZK_ROOT}/config/mixnet:/var/lib/katzenpost
  mix-gateway:
    command:
    - /usr/local/bin/server
    - -f
    - /var/lib/katzenpost/gateway1/katzenpost.toml
    container_name: mix-gateway
    depends_on:
    - mix-1
    - mix-2
    - mix-3
    image: ${IMAGE_MIXNET:-zeros/mixnet-node:arm64}
    mem_limit: ${MIXNET_MEM_LIMIT}
    network_mode: host
    restart: unless-stopped
    volumes:
    - ${ZK_ROOT}/config/mixnet:/var/lib/katzenpost
  mix-servicenode:
    container_name: mix-servicenode
    depends_on:
    - mix-1
    - mix-2
    - mix-3
    entrypoint:
    - /servicenode-entrypoint.sh
    image: ${IMAGE_MIXNET:-zeros/mixnet-node:arm64}
    mem_limit: ${MIXNET_MEM_LIMIT}
    network_mode: host
    restart: unless-stopped
    volumes:
    - ${ZK_ROOT}/config/mixnet:/var/lib/katzenpost
    - ${ZK_BIN:-${ZK_ROOT}/bin}/chatd:/usr/local/bin/chatd:ro
    - ${ZK_ROOT}/config/mixnet/servicenode-entrypoint.sh:/servicenode-entrypoint.sh:ro
  mixnet-proxy:
    command:
    - --config
    - /etc/mixnet-proxy/config.json
    container_name: mixnet-proxy
    depends_on:
    - mix-client
    image: ${IMAGE_MIXNET_PROXY:-zeros/mixnet-proxy:arm64}
    mem_limit: ${PROXY_MEM_LIMIT}
    network_mode: host
    restart: unless-stopped
    volumes:
    - ${ZK_ROOT}/config/proxy/config.json:/etc/mixnet-proxy/config.json:ro
    - ${ZK_ROOT}/config/proxy/thinclient.toml:/etc/mixnet-proxy/thinclient.toml:ro
  reticulum:
    command:
    - --config
    - /etc/reticulum
    container_name: reticulum
    image: ${IMAGE_RETICULUM:-zeros/reticulum:arm64}
    network_mode: host
    restart: unless-stopped
    volumes:
    - ${ZK_ROOT}/config/reticulum/config:/etc/reticulum
    - ${ZK_ROOT}/data/reticulum:/var/lib/reticulum
  nomadnet:
    build:
      context: ${ZK_ROOT}
      dockerfile: Dockerfile.nomadnet
    command:
    - --daemon
    - --config
    - /etc/nomadnet
    container_name: nomadnet
    network_mode: host
    restart: unless-stopped
    volumes:
    - ${ZK_ROOT}/config/nomadnet:/etc/nomadnet:rw
    - ${ZK_ROOT}/config/nomadnet/pages:/var/lib/nomadnet/pages:rw
    - ${ZK_ROOT}/data/nomadnet:/var/lib/nomadnet
    - ${ZK_ROOT}/config/nomadnet/llm-wiki-proxy.sh:/usr/local/bin/llm-wiki-proxy.sh:ro
  storage-proved:
    command:
    - --listen
    - 0.0.0.0:${STORAGE_PROVED_PORT:-9201}
    - --dir
    - /var/lib/ant-node/chunks
    container_name: storage-proved
    image: ${IMAGE_STORAGE_PROVED:-zeros/storage-proved-rs:arm64}
    networks:
    - autonomi
    ports:
    - 127.0.0.1:${STORAGE_PROVED_PORT:-9201}:${STORAGE_PROVED_PORT:-9201}
    restart: unless-stopped
    volumes:
    - ${AUTONOMI_CHUNK_DB:-${ZK_ROOT}/data/chunks}:/var/lib/ant-node/chunks:ro
  walletshield:
    command:
    - -config
    - /etc/walletshield/config.toml
    - -listen
    - 127.0.0.1:${WALLETSHIELD_PORT:-9200}
    - -thin
    - -timeout
    - "120"
    - -log_level
    - INFO
    - -upstream
    - ${WALLETSHIELD_UPSTREAM:-https://ethereum-rpc.publicnode.com}
    container_name: walletshield
    depends_on:
    - mix-client
    entrypoint: /walletshield
    image: ${IMAGE_WALLETSHIELD:-ws-deploy:latest}
    network_mode: host
    restart: unless-stopped
    volumes:
    - ${ZK_ROOT}/config/walletshield/config.toml:/etc/walletshield/config.toml:ro
    - ${ZK_ROOT}/data/walletshield:/var/lib/walletshield
  zkchat:
    command:
    - while true; do /usr/local/bin/zkchat poll /etc/zkchat/thinclient.toml 2>&1;
      sleep 30; done
    container_name: zkchat
    entrypoint:
    - sh
    - -c
    image: ${IMAGE_MIXNET:-zeros/mixnet-node:arm64}
    network_mode: host
    restart: unless-stopped
    volumes:
    - ${ZK_ROOT}/config/mixnet/client/thinclient.toml:/etc/zkchat/thinclient.toml:ro
    - ${ZK_BIN:-${ZK_ROOT}/bin}/zkchat:/usr/local/bin/zkchat:ro
  zknode-dashboard:
    build:
      context: ${ZK_ROOT}/zknode-dashboard
    container_name: zknode-dashboard
    environment:
    - PORT=${DASHBOARD_PORT:-8080}
    - WS_PORT=${WS_PORT:-9200}
    - LLM_WIKI_PORT=${LLM_WIKI_PORT:-18765}
    image: ${IMAGE_DASHBOARD:-zknode-dashboard:latest}
    network_mode: host
    ports:
    - ${DASHBOARD_PORT:-8080}:${DASHBOARD_PORT:-8080}
    restart: unless-stopped
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - ${ZK_BIN:-${ZK_ROOT}/bin}/llm-wiki:/usr/local/bin/llm-wiki:ro
    - ${ZK_WIKIS:-${ZK_ROOT}/wikis}:/wikis:ro
    - ${ZK_LLM_WIKI_HOME:-${ZK_ROOT}/.llm-wiki}:/root/.llm-wiki:rw
    - ${ZK_ROOT}/config/nomadnet/pages:/var/nomadnet/pages:rw
    - ${ZK_BIN:-${ZK_ROOT}/bin}/zkchat:/usr/local/bin/zkchat:ro
    - ${ZK_ROOT}/config/mixnet/client/thinclient.toml:/etc/zkchat/thinclient.toml:ro
    - ${ZK_ROOT}/config/mixnet/client/.zkchat/identity:/etc/zkchat/identity:ro
    - ${ZK_ROOT}/zknode-dashboard/server/:/app/server/
    - ${ZK_ROOT}/zknode-dashboard/public/:/app/public/
    - /run/zkstatus/:/run/zkstatus/:ro
    - ${ZK_BIN:-${ZK_ROOT}/bin}/ant:/usr/local/bin/ant:ro
    - ${ZK_ANT_SHARE:-${ZK_ROOT}/data/ant-share}:/root/.local/share/ant:rw
    - ${ZK_POOL:-/mnt/autonomi}:/mnt/autonomi:rw
  llm-wiki:
    command:
    - "printf '[safe]\n\tdirectory = /var/lib/llm-wiki\n' > /root/.gitconfig && exec /usr/local/bin/llm-wiki serve --http ${LLM_WIKI_PORT:-18765} --wiki /var/lib/llm-wiki"
    container_name: llm-wiki
    entrypoint:
    - sh
    - -c
    image: debian:testing-slim
    network_mode: host
    restart: unless-stopped
    volumes:
    - ${ZK_BIN:-${ZK_ROOT}/bin}/llm-wiki:/usr/local/bin/llm-wiki:ro
    - ${ZK_WIKIS:-${ZK_ROOT}/wikis}:/var/lib/llm-wiki:rw
    - ${ZK_LLM_WIKI_HOME:-${ZK_ROOT}/.llm-wiki}:/root/.llm-wiki:rw
