# peers.conf — operator seed for the bootable USB node's WireGuard tunnel.
# Drop this file at <PERSIST>/vpn/peers.conf (or pre-seed /etc/zknode/vpn/peers.conf
# in the image build) to make the node dial your hub on first boot.
# The node's OWN keypair is generated on first boot and printed to the console;
# register its public key on the hub as AllowedIPs of your choosing.
#
# Mesh scheme: 10.66.0.0/24, hub = .1, spokes = .2+ (see docs/VPN_OVERLAY.md)

[Peer]
PublicKey = <HUB_PUBLIC_KEY>
Endpoint  = <HUB_HOST>:51820
AllowedIPs = 10.66.0.0/24
PersistentKeepalive = 25