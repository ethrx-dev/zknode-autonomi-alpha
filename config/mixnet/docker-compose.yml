
services:

  gateway1:
    restart: "no"
    image: katzenpost-go_mod
    volumes:
      - ./:/var/lib/katzenpost
    command: /var/lib/katzenpost/server -f /var/lib/katzenpost/gateway1/katzenpost.toml
    network_mode: host
    depends_on:
      - auth1
      - auth2
      - auth3
  servicenode1:
    restart: "no"
    image: katzenpost-go_mod
    volumes:
      - ./:/var/lib/katzenpost
    command: /var/lib/katzenpost/server -f /var/lib/katzenpost/servicenode1/katzenpost.toml
    network_mode: host
    depends_on:
      - auth1
      - auth2
      - auth3
  mix1:
    restart: "no"
    image: katzenpost-go_mod
    volumes:
      - ./:/var/lib/katzenpost
    command: /var/lib/katzenpost/server -f /var/lib/katzenpost/mix1/katzenpost.toml
    network_mode: host
    depends_on:
      - auth1
      - auth2
      - auth3
  mix2:
    restart: "no"
    image: katzenpost-go_mod
    volumes:
      - ./:/var/lib/katzenpost
    command: /var/lib/katzenpost/server -f /var/lib/katzenpost/mix2/katzenpost.toml
    network_mode: host
    depends_on:
      - auth1
      - auth2
      - auth3
  mix3:
    restart: "no"
    image: katzenpost-go_mod
    volumes:
      - ./:/var/lib/katzenpost
    command: /var/lib/katzenpost/server -f /var/lib/katzenpost/mix3/katzenpost.toml
    network_mode: host
    depends_on:
      - auth1
      - auth2
      - auth3
  replica1:
    restart: "no"
    image: katzenpost-go_mod
    volumes:
      - ./:/var/lib/katzenpost
    command: /var/lib/katzenpost/replica -f /var/lib/katzenpost/replica1/replica.toml
    network_mode: host
    depends_on:
      - auth1
      - auth2
      - auth3
  replica2:
    restart: "no"
    image: katzenpost-go_mod
    volumes:
      - ./:/var/lib/katzenpost
    command: /var/lib/katzenpost/replica -f /var/lib/katzenpost/replica2/replica.toml
    network_mode: host
    depends_on:
      - auth1
      - auth2
      - auth3
  replica3:
    restart: "no"
    image: katzenpost-go_mod
    volumes:
      - ./:/var/lib/katzenpost
    command: /var/lib/katzenpost/replica -f /var/lib/katzenpost/replica3/replica.toml
    network_mode: host
    depends_on:
      - auth1
      - auth2
      - auth3
  replica4:
    restart: "no"
    image: katzenpost-go_mod
    volumes:
      - ./:/var/lib/katzenpost
    command: /var/lib/katzenpost/replica -f /var/lib/katzenpost/replica4/replica.toml
    network_mode: host
    depends_on:
      - auth1
      - auth2
      - auth3
  replica5:
    restart: "no"
    image: katzenpost-go_mod
    volumes:
      - ./:/var/lib/katzenpost
    command: /var/lib/katzenpost/replica -f /var/lib/katzenpost/replica5/replica.toml
    network_mode: host
    depends_on:
      - auth1
      - auth2
      - auth3
  auth1:
    restart: "no"
    image: katzenpost-go_mod
    volumes:
      - ./:/var/lib/katzenpost
    command: /var/lib/katzenpost/dirauth -f /var/lib/katzenpost/auth1/authority.toml
    network_mode: host

  auth2:
    restart: "no"
    image: katzenpost-go_mod
    volumes:
      - ./:/var/lib/katzenpost
    command: /var/lib/katzenpost/dirauth -f /var/lib/katzenpost/auth2/authority.toml
    network_mode: host

  auth3:
    restart: "no"
    image: katzenpost-go_mod
    volumes:
      - ./:/var/lib/katzenpost
    command: /var/lib/katzenpost/dirauth -f /var/lib/katzenpost/auth3/authority.toml
    network_mode: host

  kpclientd:
    restart: "no"
    image: katzenpost-go_mod
    volumes:
      - ./:/var/lib/katzenpost
    command: /var/lib/katzenpost/kpclientd -c /var/lib/katzenpost/client/client.toml
    network_mode: host
