name: Build, Test & Push (multi-arch)

on:
  push:
    branches: [main, p4p-v0.2-build]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repo test suite
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck || true
          ./tests/run-all.sh

  build-push:
    # Tests gate the publish; images publish on main/branch pushes only
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: mixnet-node
            file: Dockerfile.mixnet
            args: "--build-arg LIBDIR=/usr/lib/aarch64-linux-gnu"
          - image: walletshield
            file: Dockerfile.walletshield
            args: ""
          - image: mixnet-proxy
            file: Dockerfile.mixnet-proxy
            args: "--build-arg LIBDIR=/usr/lib/aarch64-linux-gnu"
          - image: ant-node
            file: Dockerfile.ant-node
            args: ""
          - image: antd
            file: Dockerfile.antd
            args: ""
          - image: storage-proved-rs
            file: Dockerfile.storage-proved-rs
            args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.image }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}
          build-args: ${{ matrix.args }}

  build-dashboard:
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (dashboard)
        uses: docker/build-push-action@v6
        with:
          context: zknode-dashboard
          file: zknode-dashboard/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/dashboard:latest
            ${{ env.IMAGE_PREFIX }}/dashboard:${{ github.sha }}
