name: Build & Push

on:
  push:
    branches: [p4p-wiki-merge]
    paths:
      - 'zknode-dashboard/**'
      - 'Dockerfile.walletshield'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dashboard
        uses: docker/build-push-action@v6
        with:
          context: zknode-dashboard
          file: zknode-dashboard/Dockerfile
          platforms: linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}/dashboard:latest
            ghcr.io/${{ github.repository }}/dashboard:${{ github.sha }}
          push: true

      - name: Build and push walletshield
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.walletshield
          platforms: linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}/walletshield:latest
            ghcr.io/${{ github.repository }}/walletshield:${{ github.sha }}
          push: true
