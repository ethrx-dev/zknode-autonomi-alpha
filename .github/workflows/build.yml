name: Build and Publish

on:
  push:
    branches: [main, p4p-wiki-merge]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_MIXNET: ghcr.io/ethrx-dev/zknode-autonomi-alpha/mixnet-node
  IMAGE_WALLETSHIELD: ghcr.io/ethrx-dev/zknode-autonomi-alpha/walletshield
  IMAGE_DASHBOARD: ghcr.io/ethrx-dev/zknode-autonomi-alpha/dashboard
  IMAGE_PROXY: ghcr.io/ethrx-dev/zknode-autonomi-alpha/mixnet-proxy
  IMAGE_KPCLIENTD: ghcr.io/ethrx-dev/zknode-autonomi-alpha/kpclientd
  IMAGE_LLM_WIKI: ghcr.io/ethrx-dev/zknode-autonomi-alpha/llm-wiki
  IMAGE_NOMADNET: ghcr.io/ethrx-dev/zknode-autonomi-alpha/nomadnet
  IMAGE_RETICULUM: ghcr.io/ethrx-dev/zknode-autonomi-alpha/reticulum

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build mixnet image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mixnet
          platforms: linux/${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE_MIXNET }}:${{ matrix.target }}-${{ github.sha }},${{ env.IMAGE_MIXNET }}:${{ matrix.target }}

      - name: Build walletshield image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.walletshield
          platforms: linux/${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE_WALLETSHIELD }}:${{ matrix.target }}-${{ github.sha }},${{ env.IMAGE_WALLETSHIELD }}:${{ matrix.target }}

      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: ./zknode-dashboard
          platforms: linux/${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE_DASHBOARD }}:${{ matrix.target }}-${{ github.sha }},${{ env.IMAGE_DASHBOARD }}:${{ matrix.target }}

      - name: Build proxy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mixnet-proxy
          platforms: linux/${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE_PROXY }}:${{ matrix.target }}-${{ github.sha }},${{ env.IMAGE_PROXY }}:${{ matrix.target }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Dockerfile syntax
        run: |
          for f in Dockerfile.* zknode-dashboard/Dockerfile; do
            echo "Linting $f"
            docker run --rm -v $PWD:/workspace hadolint/hadolint:latest hadolint /workspace/$f
          done

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
      - name: Upload results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
