name: Build & Push

on:
  push:
    branches: [p4p-wiki-merge, portable-usb]
    paths:
      - 'zknode-dashboard/**'
      - 'Dockerfile*'
      - 'cmd/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        platform: [linux/arm64, linux/amd64]
        # map to the arch suffix used in tags/env
        include:
          - platform: linux/arm64
            arch: arm64
          - platform: linux/amd64
            arch: amd64

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dashboard
        uses: docker/build-push-action@v6
        with:
          context: zknode-dashboard
          file: zknode-dashboard/Dockerfile
          platforms: ${{ matrix.platform }}
          tags: |
            ghcr.io/${{ github.repository }}/dashboard:${{ matrix.arch }}
            ghcr.io/${{ github.repository }}/dashboard:${{ github.sha }}
          push: true

      - name: Build and push walletshield
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.walletshield
          platforms: ${{ matrix.platform }}
          tags: |
            ghcr.io/${{ github.repository }}/walletshield:${{ matrix.arch }}
            ghcr.io/${{ github.repository }}/walletshield:${{ github.sha }}
          push: true

      - name: Build and push mixnet node
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mixnet
          build-args: |
            TARGETARCH=${{ matrix.arch }}
          platforms: ${{ matrix.platform }}
          tags: |
            ghcr.io/${{ github.repository }}/mixnet-node:${{ matrix.arch }}
            ghcr.io/${{ github.repository }}/mixnet-node:${{ github.sha }}
          push: true

      - name: Build and push mixnet-proxy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mixnet-proxy
          build-args: |
            TARGETARCH=${{ matrix.arch }}
          platforms: ${{ matrix.platform }}
          tags: |
            ghcr.io/${{ github.repository }}/mixnet-proxy:${{ matrix.arch }}
            ghcr.io/${{ github.repository }}/mixnet-proxy:${{ github.sha }}
          push: true

      - name: Build and push antd
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.antd
          build-args: |
            TARGETARCH=${{ matrix.arch }}
          platforms: ${{ matrix.platform }}
          tags: |
            ghcr.io/${{ github.repository }}/antd:${{ matrix.arch }}
            ghcr.io/${{ github.repository }}/antd:${{ github.sha }}
          push: true
